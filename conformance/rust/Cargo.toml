[package]
name = "conformance-rust"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# Compiles upstream typify's generated Rust for every fixture
# (tests/oracle/typify/*.tokens) and round-trips JSON instances through serde.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
regress = "=0.12.0"
chrono = { version = "=0.4.45", features = ["serde"] }
uuid = { version = "=1.16.0", features = ["serde"] }

[workspace]
